[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dewhirlpooler"
version = "0.1.0"
description = "Self-hosted Whirlpool exposure analysis from a Bitcoin node"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[project.scripts]
dewhirlpooler = "dewhirlpooler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dewhirlpooler = [
    "static/*.css",
    "static/*.html",
    "static/*.js",
    "static/vendor/*",
]
