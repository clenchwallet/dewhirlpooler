name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install -e '.[test]' 'ruff>=0.12,<1'
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Lint Python sources
        run: ruff check --select E,F,I,UP src tests
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check whitespace
        run: git diff --check

  container:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Render Compose configuration
        env:
          DEWHIRLPOOLER_FULCRUM_HOST: fulcrum.invalid
        run: docker compose config > /tmp/dewhirlpooler-compose.yml
      - name: Build container image
        run: docker build --tag clenchwallet/dewhirlpooler:ci .
      - name: Verify container user
        run: |
          test "$(docker image inspect \
            --format '{{.Config.User}}' \
            clenchwallet/dewhirlpooler:ci)" = "10001:10001"
      - name: Start container
        run: |
          docker run --detach \
            --name dewhirlpooler-ci \
            --publish 127.0.0.1:8000:8000 \
            --env DEWHIRLPOOLER_FULCRUM_HOST=fulcrum.invalid \
            clenchwallet/dewhirlpooler:ci
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent \
              http://127.0.0.1:8000/health || true)"
            if [ "$response" = '{"status":"ok"}' ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs dewhirlpooler-ci
          exit 1
      - name: Verify packaged page
        run: |
          curl --fail --silent http://127.0.0.1:8000/ \
            | grep --fixed-strings '<title>DeWhirlpooler</title>'
      - name: Stop container
        if: always()
        run: docker rm --force dewhirlpooler-ci || true
