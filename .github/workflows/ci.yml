name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install -e '.[test]' 'ruff>=0.12,<1'
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Lint Python sources
        run: ruff check --select E,F,I,UP src tests
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check whitespace
        run: git diff --check

  container:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Render Compose configuration
        env:
          DEWHIRLPOOLER_FULCRUM_HOST: fulcrum.invalid
        run: docker compose config > /tmp/dewhirlpooler-compose.yml
      - name: Build container image
        run: docker build --tag clenchwallet/dewhirlpooler:ci .
      - name: Verify container user
        run: |
          test "$(docker image inspect \
            --format '{{.Config.User}}' \
            clenchwallet/dewhirlpooler:ci)" = "10001:10001"
      - name: Start container
        run: |
          docker run --detach \
            --name dewhirlpooler-ci \
            --publish 127.0.0.1:8000:8000 \
            --env DEWHIRLPOOLER_FULCRUM_HOST=fulcrum.invalid \
            clenchwallet/dewhirlpooler:ci
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent \
              http://127.0.0.1:8000/health || true)"
            if [ "$response" = '{"status":"ok"}' ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs dewhirlpooler-ci
          exit 1
      - name: Verify packaged page
        run: |
          curl --fail --silent http://127.0.0.1:8000/ \
            | grep --fixed-strings '<title>DeWhirlpooler</title>'
      - name: Stop container
        if: always()
        run: docker rm --force dewhirlpooler-ci || true

  release:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    needs:
      - python
      - container
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Verify version and wheel assets
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          import zipfile

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          expected = f"Release v{version}"
          if os.environ["RELEASE_COMMIT_MESSAGE"] != expected:
              raise SystemExit(
                  f"release commit must be exactly {expected!r}"
              )
          if not pathlib.Path("dist").is_dir():
              raise SystemExit("dist directory is missing")
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "dewhirlpooler/static/app.css",
              "dewhirlpooler/static/app.js",
              "dewhirlpooler/static/index.html",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel assets missing: {sorted(missing)}")
          print(f"{expected}: distributions verified")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v${version}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' \
            'Self-hosted Whirlpool exposure analysis for Bitcoin Core and Fulcrum.' \
            '' \
            '- Tx0, Whirlpool, postmix, Stonewall, Ricochet, and Payjoin/Cahoots heuristics' \
            '- Bounded exposure graph through browser, CLI, and HTTP API' \
            '- Resumable SQLite pool-liquidity and coordinator accounting index' \
            '- Local report cache and Docker Compose packaging' \
            '' \
            'The historical index is not bundled. Run `dewhirlpooler chain-index` locally to populate network-wide statistics.' \
            > "$notes_file"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "DeWhirlpooler ${tag}" \
            --notes-file "$notes_file" \
            dist/*
